# Publications shown on the Research page (/research/).
#
# To add a new publication, copy one of the blocks below and fill it in.
#
# Fields:
#   title    - required
#   authors  - required. Write it exactly as you want it displayed; "Moore, R.C."
#              is automatically bolded wherever it appears, so use that exact form.
#              Add a trailing * for co-first authorship (e.g. "Moore, R.C.*").
#   venue    - required for published/conditionally_accepted. Omit entirely for
#              in_revision (R&R) entries — the repo is public, and this keeps
#              the specific R&R venue from being publicly visible before the
#              outcome is settled. (under_review never shows a venue either.)
#   year     - required for status: published
#   status   - "published", "conditionally_accepted", "in_revision", or
#              "under_review". Anything other than "published" shows in the
#              "Working Papers" list instead of the main tagged list, and
#              doesn't need image/links/tags (though preprint links are nice).
#   image    - optional path to a thumbnail, e.g. /assets/pubs/qanon.jpg.
#              Recommended: roughly square, at least 200x200px. If omitted, a
#              placeholder icon is shown. Put image files in assets/pubs/.
#   links    - optional list of {label, url}, e.g. DOI, Preprint, PDF, website.
#   coverage - optional list of {label, url} for press coverage.
#   awards   - optional list of plain-text award strings.
#   tags     - optional list of topic tags for the filter buttons on /research/.
#              Reuse existing tags (misinformation, scams, older-adults,
#              computational-methods, media-consumption, interventions, ai)
#              where they fit, or introduce a new one if a paper doesn't match
#              any existing tag.
#   blurb    - optional 1-2 sentence plain-language summary. If present, a
#              "nutshell description" toggle appears for that entry.

